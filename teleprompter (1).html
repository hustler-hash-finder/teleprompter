<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Studio</title>

<!-- Font: IBM Plex Mono untuk panel kontrol (kesan alat studio/broadcast),
     Work Sans untuk teks naskah (jelas dan nyaman dibaca saat rekaman) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     1. DESIGN TOKENS
     Semua warna, jarak, dan tipografi dipusatkan di sini supaya
     mudah diubah tanpa menelusuri seluruh file.
     ========================================================== */
  :root{
    --bg-app: #16171a;
    --bg-panel: #1e2023;
    --bg-panel-2: #25272b;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text-primary: #f2f1ec;
    --text-secondary: #98988f;
    --text-muted: #6c6c65;
    --accent: #e8a33d;         /* warna aksen: lampu tally studio siaran */
    --accent-soft: rgba(232,163,61,0.14);
    --rec: #e5484d;            /* indikator "sedang berjalan" */
    --font-ui: 'IBM Plex Mono', monospace;
    --font-read: 'Work Sans', sans-serif;
    --radius: 10px;
    --radius-sm: 6px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
  }

  /* ==========================================================
     2. LAYOUT UTAMA
     Grid: panel kontrol di kiri, layar teleprompter di kanan.
     Menyempit jadi satu kolom di layar tablet/ponsel.
     ========================================================== */
  .app{
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 900px){
    .app{ grid-template-columns: 1fr; }
  }

  /* ---------- Header (di dalam panel kiri) ---------- */
  .brand{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand-title{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-primary);
  }
  .brand-sub{
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }
  .rec-indicator{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }
  .rec-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.2s;
  }
  .rec-dot.live{
    background: var(--rec);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }

  /* ---------- Panel kiri: input naskah + kontrol ---------- */
  .panel-left{
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .section{
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }

  .label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 10px;
    display: block;
  }

  /* Area input naskah: besar, mudah ditempel teks panjang */
  #script-input{
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-read);
    font-size: 14px;
    line-height: 1.6;
    padding: 12px;
  }
  #script-input:focus{
    outline: none;
    border-color: var(--accent);
  }

  /* ---------- Baris kontrol (slider) ---------- */
  .control-row{
    margin-bottom: 16px;
  }
  .control-row:last-child{ margin-bottom: 0; }
  .control-row-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .control-row-head .label{ margin-bottom: 0; }
  .control-value{
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }

  input[type="range"]{
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border-strong);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  input[type="range"]::-moz-range-thumb{
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* ---------- Pilihan tema warna latar (aksesibilitas) ---------- */
  .theme-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .theme-swatch{
    height: 40px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-read);
    font-size: 13px;
    font-weight: 600;
    padding: 0;
  }
  .theme-swatch.active{ border-color: var(--accent); }
  .theme-swatch[data-theme="classic"]{ background: #000; color: #fff; }
  .theme-swatch[data-theme="invert"]{ background: #fff; color: #000; }
  .theme-swatch[data-theme="navy"]{ background: #0b1a33; color: #ffd83d; }
  .theme-swatch[data-theme="phosphor"]{ background: #161616; color: #4ade80; }

  /* ---------- Toggle mode cermin ---------- */
  .toggle-row{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .toggle-row input{ width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- Tombol aksi ---------- */
  .btn-row{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button{
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-panel-2);
    color: var(--text-primary);
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover{ background: #2c2e33; border-color: var(--accent); }
  button:active{ transform: scale(0.98); }
  button.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1200;
  }
  button.primary:hover{ background: #f0ae4d; }
  button.ghost{ background: transparent; }

  /* ==========================================================
     3. PANEL KANAN: LAYAR TELEPROMPTER
     ========================================================== */
  .panel-right{
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-app);
  }

  #display{
    flex: 1;
    overflow-y: auto;
    position: relative;
    scroll-behavior: auto;
  }
  #display.theme-classic{ background: #000; }
  #display.theme-invert{ background: #fff; }
  #display.theme-navy{ background: #0b1a33; }
  #display.theme-phosphor{ background: #161616; }

  /* Kolom teks dibatasi lebarnya supaya nyaman dibaca, diberi
     ruang kosong atas/bawah agar naskah bisa digulir sampai habis */
  .text-wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 45vh 40px 70vh;
  }
  #scroll-text{
    font-family: var(--font-read);
    font-size: 36px;
    line-height: 1.6;
    font-weight: 500;
    white-space: pre-wrap;
    color: #fff;
    transition: transform 0.2s, font-size 0.15s;
  }
  #display.theme-classic #scroll-text{ color: #fff; }
  #display.theme-invert #scroll-text{ color: #000; }
  #display.theme-navy #scroll-text{ color: #ffd83d; }
  #display.theme-phosphor #scroll-text{ color: #4ade80; }

  /* Garis panduan baca: menandai baris "posisi mata", diam di
     tempat sementara teks bergulir di belakangnya — ini elemen
     ciri khas alat ini, meniru garis panduan teleprompter fisik */
  .reading-guide{
    position: absolute;
    left: 0;
    right: 0;
    top: 42%;
    height: 0;
    border-top: 1px dashed var(--accent);
    opacity: 0.55;
    pointer-events: none;
  }
  .reading-guide::before,
  .reading-guide::after{
    content: "";
    position: absolute;
    top: -5px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .reading-guide::before{
    left: 6px;
    border-left: 7px solid var(--accent);
  }
  .reading-guide::after{
    right: 6px;
    border-right: 7px solid var(--accent);
  }

  /* Tombol geser manual (naik/turun) mengambang di layar */
  .manual-controls{
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 5;
  }
  .manual-controls button{
    width: 40px;
    height: 40px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
    font-size: 16px;
    background: rgba(30,32,35,0.85);
  }

  /* Placeholder saat naskah masih kosong */
  .empty-hint{
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-top: -20vh;
  }

  /* Fokus keyboard tetap terlihat untuk aksesibilitas */
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Hormati preferensi pengguna yang mematikan animasi */
  @media (prefers-reduced-motion: reduce){
    .rec-dot.live{ animation: none; }
    #scroll-text{ transition: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============================================================
       PANEL KIRI: judul, input naskah, dan seluruh kontrol
       ============================================================ -->
  <div class="panel-left">

    <div class="brand">
      <div>
        <div class="brand-title">Teleprompter Studio</div>
        <div class="brand-sub">Alat bantu baca naskah</div>
      </div>
      <div class="rec-indicator">
        <span class="rec-dot" id="rec-dot"></span>
        <span id="rec-label">DIAM</span>
      </div>
    </div>

    <!-- 1. AREA INPUT NASKAH -->
    <div class="section">
      <label class="label" for="script-input">Naskah</label>
      <textarea id="script-input" placeholder="Tempel atau ketik naskah kontenmu di sini...">Selamat datang di Teleprompter Studio.

Tempelkan naskah Anda di kotak ini. Teks akan otomatis muncul di layar sebelah kanan dan dapat digulir otomatis maupun manual.

Atur kecepatan, ukuran huruf, dan warna latar sesuai kenyamanan mata Anda sebelum mulai merekam.</textarea>
    </div>

    <!-- 2. KONTROL KECEPATAN & UKURAN FONT -->
    <div class="section">
      <div class="control-row">
        <div class="control-row-head">
          <label class="label" for="speed" style="margin-bottom:0;">Kecepatan gulir</label>
          <span class="control-value" id="speed-out">4</span>
        </div>
        <input type="range" id="speed" min="1" max="10" step="1" value="4">
      </div>

      <div class="control-row">
        <div class="control-row-head">
          <label class="label" for="fontsize" style="margin-bottom:0;">Ukuran huruf</label>
          <span class="control-value" id="fontsize-out">36px</span>
        </div>
        <input type="range" id="fontsize" min="20" max="80" step="2" value="36">
      </div>
    </div>

    <!-- 3. TEMA WARNA UNTUK AKSESIBILITAS -->
    <div class="section">
      <label class="label">Warna latar &amp; teks</label>
      <div class="theme-grid" id="theme-grid">
        <button type="button" class="theme-swatch active" data-theme="classic" title="Hitam / Putih">Aa</button>
        <button type="button" class="theme-swatch" data-theme="invert" title="Putih / Hitam">Aa</button>
        <button type="button" class="theme-swatch" data-theme="navy" title="Navy / Kuning">Aa</button>
        <button type="button" class="theme-swatch" data-theme="phosphor" title="Abu gelap / Hijau">Aa</button>
      </div>
      <label class="toggle-row" style="margin-top:14px;">
        <input type="checkbox" id="mirror">
        Mode cermin (untuk kaca pemantul teleprompter)
      </label>
    </div>

    <!-- 4. TOMBOL AKSI -->
    <div class="section" style="border-bottom:none;">
      <label class="label">Kontrol</label>
      <div class="btn-row">
        <button type="button" class="primary" id="play-btn">▶ Mulai</button>
        <button type="button" id="reset-btn">↺ Ulang</button>
        <button type="button" class="ghost" id="fullscreen-btn">⛶ Layar penuh</button>
      </div>
    </div>

  </div>

  <!-- ============================================================
       PANEL KANAN: layar tampilan teleprompter
       ============================================================ -->
  <div class="panel-right">
    <div id="display" class="theme-classic">
      <div class="reading-guide" aria-hidden="true"></div>
      <div class="text-wrap">
        <div id="scroll-text"></div>
      </div>
    </div>

    <!-- Tombol geser manual, dipakai saat gulir otomatis dijeda -->
    <div class="manual-controls">
      <button type="button" id="scroll-up" aria-label="Gulir ke atas">↑</button>
      <button type="button" id="scroll-down" aria-label="Gulir ke bawah">↓</button>
    </div>
  </div>

</div>

<script>
/* ================================================================
   TELEPROMPTER STUDIO — LOGIKA APLIKASI
   Semua fungsi interaktif dikelompokkan per fitur agar mudah
   ditelusuri dan dimodifikasi.
   ================================================================ */

// ---- Ambil referensi seluruh elemen yang dibutuhkan ----
const scriptInput   = document.getElementById('script-input');
const display       = document.getElementById('display');
const scrollText    = document.getElementById('scroll-text');
const playBtn       = document.getElementById('play-btn');
const resetBtn      = document.getElementById('reset-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const speedInput    = document.getElementById('speed');
const speedOut      = document.getElementById('speed-out');
const fontInput     = document.getElementById('fontsize');
const fontOut       = document.getElementById('fontsize-out');
const mirrorToggle  = document.getElementById('mirror');
const themeGrid     = document.getElementById('theme-grid');
const recDot        = document.getElementById('rec-dot');
const recLabel      = document.getElementById('rec-label');
const scrollUpBtn   = document.getElementById('scroll-up');
const scrollDownBtn = document.getElementById('scroll-down');

// ----------------------------------------------------------------
// 1. SINKRONISASI NASKAH: apa yang diketik di kotak input langsung
//    muncul di layar teleprompter di sebelah kanan.
// ----------------------------------------------------------------
function syncScript(){
  scrollText.textContent = scriptInput.value;
}
scriptInput.addEventListener('input', syncScript);
syncScript(); // isi awal saat halaman dibuka

// ----------------------------------------------------------------
// 2. GULIR OTOMATIS (menggunakan requestAnimationFrame supaya
//    kecepatan konsisten di berbagai perangkat)
// ----------------------------------------------------------------
let isPlaying = false;
let rafId = null;
let lastTimestamp = null;

function animateScroll(timestamp){
  if (!isPlaying) return;
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const delta = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  const speedLevel = parseInt(speedInput.value, 10); // 1 (pelan) - 10 (cepat)
  display.scrollTop += (speedLevel * 0.035) * delta;

  rafId = requestAnimationFrame(animateScroll);
}

function setPlaying(state){
  isPlaying = state;
  lastTimestamp = null;

  if (isPlaying){
    playBtn.textContent = '⏸ Jeda';
    recDot.classList.add('live');
    recLabel.textContent = 'BERJALAN';
    rafId = requestAnimationFrame(animateScroll);
  } else {
    playBtn.textContent = '▶ Mulai';
    recDot.classList.remove('live');
    recLabel.textContent = 'DIAM';
    if (rafId) cancelAnimationFrame(rafId);
  }
}

playBtn.addEventListener('click', () => setPlaying(!isPlaying));

// Tombol ulang: hentikan gulir otomatis dan kembali ke awal naskah
resetBtn.addEventListener('click', () => {
  setPlaying(false);
  display.scrollTop = 0;
});

// ----------------------------------------------------------------
// 3. GULIR MANUAL
//    Pengguna tetap bisa scroll bebas dengan mouse wheel / sentuhan
//    (bawaan browser karena #display diberi overflow-y:auto).
//    Tombol panah berikut ini untuk kontrol manual yang presisi.
// ----------------------------------------------------------------
scrollUpBtn.addEventListener('click', () => {
  display.scrollBy({ top: -120, behavior: 'smooth' });
});
scrollDownBtn.addEventListener('click', () => {
  display.scrollBy({ top: 120, behavior: 'smooth' });
});

// ----------------------------------------------------------------
// 4. KECEPATAN GULIR
// ----------------------------------------------------------------
speedInput.addEventListener('input', () => {
  speedOut.textContent = speedInput.value;
});

// ----------------------------------------------------------------
// 5. UKURAN HURUF (aksesibilitas)
// ----------------------------------------------------------------
fontInput.addEventListener('input', () => {
  const px = fontInput.value;
  fontOut.textContent = px + 'px';
  scrollText.style.fontSize = px + 'px';
});

// ----------------------------------------------------------------
// 6. TEMA WARNA LATAR & TEKS (aksesibilitas)
//    Setiap tombol swatch punya atribut data-theme yang dicocokkan
//    dengan class CSS pada elemen #display.
// ----------------------------------------------------------------
const THEMES = ['classic', 'invert', 'navy', 'phosphor'];

themeGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.theme-swatch');
  if (!btn) return;

  const theme = btn.dataset.theme;

  // Hapus semua class tema lama, pasang yang baru
  THEMES.forEach(t => display.classList.remove('theme-' + t));
  display.classList.add('theme-' + theme);

  // Perbarui status "aktif" secara visual pada tombol swatch
  themeGrid.querySelectorAll('.theme-swatch').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
});

// ----------------------------------------------------------------
// 7. MODE CERMIN
//    Membalik teks secara horizontal — dipakai saat layar diletakkan
//    di balik kaca pemantul pada perangkat teleprompter fisik.
// ----------------------------------------------------------------
mirrorToggle.addEventListener('change', () => {
  scrollText.style.transform = mirrorToggle.checked ? 'scaleX(-1)' : 'none';
});

// ----------------------------------------------------------------
// 8. LAYAR PENUH
//    Memakai Fullscreen API bawaan browser pada panel layar kanan.
// ----------------------------------------------------------------
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement){
    display.requestFullscreen().catch(() => {
      // Sebagian browser/perangkat membatasi fullscreen; abaikan jika gagal
    });
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement
    ? '⛶ Keluar layar penuh'
    : '⛶ Layar penuh';
});

// ----------------------------------------------------------------
// 9. PINTASAN KEYBOARD (opsional, memudahkan saat sedang merekam)
//    Spasi = mulai/jeda, panah atas/bawah = geser manual.
// ----------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  // Jangan aktifkan pintasan saat pengguna sedang mengetik di textarea
  if (document.activeElement === scriptInput) return;

  if (e.code === 'Space'){
    e.preventDefault();
    setPlaying(!isPlaying);
  } else if (e.code === 'ArrowUp'){
    e.preventDefault();
    display.scrollBy({ top: -80, behavior: 'smooth' });
  } else if (e.code === 'ArrowDown'){
    e.preventDefault();
    display.scrollBy({ top: 80, behavior: 'smooth' });
  }
});
</script>

</body>
</html>
